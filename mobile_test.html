<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanobot Lite + SD knowledge test</title><style>body{font:16px system-ui;background:#101820;color:#eee;padding:16px}input,button{font:inherit;padding:12px;border-radius:10px;margin:5px}button{background:#66d9a0;border:0}pre{background:#22303b;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Nanobot Lite</h1><p>Mobile database tester: use file picker to load knowledge.json from your SD card.</p><input type="file" id="file" accept=".json,application/json"><p><input id="q" placeholder="Search database"><button onclick="searchDb()">Search SD database</button></p><p><input id="cmd" placeholder="Try stop / move forward / வணக்கம்"><button onclick="route()">Route command</button></p><pre id="out">Load a JSON knowledge file from SD to search it.</pre><script>let db=[];file.onchange=async()=>{let f=file.files[0];if(!f)return;try{db=JSON.parse(await f.text());out.textContent='Loaded '+db.length+' knowledge records from '+f.name}catch(e){out.textContent='Invalid JSON: '+e}};function searchDb(){let s=q.value.toLowerCase().trim();let hits=db.filter(x=>(String(x.title||'')+' '+String(x.text||'')).toLowerCase().includes(s)).slice(0,5);out.textContent=JSON.stringify({loaded_records:db.length,query:s,hits},null,2)}const rules={stop:['stop','halt','freeze','நிறுத்து','නවත්වන්න'],greeting:['hello','hi','hey','வணக்கம்','ආයුබෝවන්'],help:['help','உதவி','උදව්'],status:['status','battery','நிலை','තත්ත්වය'],forward:['move forward','go forward','forward','முன்னே போ','ඉදිරියට යන්න'],back:['move back','go back','backward','பின்னால் போ','පස්සට යන්න'],left:['turn left','இடது','වමට'],right:['turn right','வலது','දකුණට'],search:['search','find','தேடு','සොයන්න']};function route(){let s=cmd.value.toLowerCase(),intent='chat';for(let [k,v] of Object.entries(rules)){if(v.some(x=>s.includes(x.toLowerCase()))){intent=k;break}}out.textContent=JSON.stringify({intent,confidence:intent==='chat'?.35:.85,needs_confirmation:['forward','back','left','right'].includes(intent),reply:'Recognized: '+intent},null,2)}</script></html>
