<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanobot Lite mobile</title><style>body{font:16px system-ui;background:#101820;color:#eee;padding:16px}input,button{font:inherit;padding:12px;border-radius:10px;margin:5px}button{background:#66d9a0;border:0}pre{background:#22303b;padding:12px;white-space:pre-wrap}</style><h1>Nanobot Lite</h1><p>Local intent demo · no API</p><input id="cmd" placeholder="Try stop / move forward / வணக்கம்"><button onclick="test()">Route</button><pre id="result">Ready</pre><script>const rules={stop:['stop','halt','freeze','நிறுத்து','நிறுத்துங்கள்','නවත්වන්න'],greeting:['hello','hi','hey','வணக்கம்','ஹலோ','ආයුබෝවන්','හෙලෝ'],help:['help','உதவி','උදව්'],status:['status','battery','நிலை','மின்கலம்','තත්ත්වය','බැටரி'],forward:['move forward','go forward','forward','முன்னே போ','ඉදිරියට යන්න'],back:['move back','go back','backward','பின்னால் போ','පස්සට යන්න'],left:['turn left','இடது','වමට'],right:['turn right','வலது','දකුණට'],search:['search','find','தேடு','සොයන්න']};function test(){let s=cmd.value.toLowerCase(),intent='chat';for(let [k,v] of Object.entries(rules)){if(v.some(x=>s.includes(x.toLowerCase()))){intent=k;break}}result.textContent=JSON.stringify({intent,confidence:intent==='chat'?.35:.85,needs_confirmation:['forward','back','left','right'].includes(intent),reply:'Recognized: '+intent},null,2)}</script></html>
